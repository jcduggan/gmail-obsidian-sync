[project]
name = "gmail-obsidian-sync"
version = "0.1.0"
description = "Sync Gmail emails to Obsidian vault as markdown"
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client==2.193.0",
    "google-auth==2.49.1",
    "google-auth-oauthlib==1.3.1",
    "google-auth-httplib2==0.3.1",
    "markdownify==1.2.2",
]

[project.scripts]
gmail-sync = "gmail_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_sync"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty]
python-version = "3.13"
